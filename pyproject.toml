[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional-quddpm"
version = "0.1.0"
description = "Conditional quantum diffusion augmentation benchmarks for TFIM QCNN classification"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
generate-tfim = "conditional_quddpm.datasets.tfim:main"
run-qcnn-baseline = "conditional_quddpm.experiments.qcnn_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
