[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional-quddpm"
version = "0.1.0"
description = "Conditional quantum diffusion augmentation benchmarks for TFIM QCNN classification"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
generate-tfim = "conditional_quddpm.datasets.tfim:main"
run-qcnn-baseline = "conditional_quddpm.experiments.qcnn_baseline:main"
run-quddpm-smoke = "conditional_quddpm.experiments.quddpm_smoke:main"
run-quddpm-tfim = "conditional_quddpm.experiments.quddpm_tfim:main"
run-quddpm-diagnostics = "conditional_quddpm.experiments.underfitting_diagnostics:main"
run-quddpm-t1-multiseed-t2 = "conditional_quddpm.experiments.t1_multiseed_t2_diagnostics:main"
run-quddpm-terminal-prior = "conditional_quddpm.experiments.terminal_prior_diagnostics:main"
run-quddpm-q2-ensemble = "conditional_quddpm.experiments.q2_ensemble_generalization:main"
run-quddpm-q2-sampling = "conditional_quddpm.experiments.q2_sampling_semantics:main"
run-quddpm-q2-objective = "conditional_quddpm.experiments.q2_objective_geometry:main"
run-quddpm-q2-gradient-signal = "conditional_quddpm.experiments.q2_gradient_signal:main"
run-quddpm-q2-single-class = "conditional_quddpm.experiments.q2_single_class_controls:main"
run-quddpm-q2-conflict-aware = "conditional_quddpm.experiments.q2_conflict_aware_step0:main"
run-quddpm-kernel-k0 = "conditional_quddpm.experiments.kernel_diagnostics:main"
run-physics-aware-augmentation = "conditional_quddpm.experiments.physics_aware_augmentation:main"
run-geometry-aware-augmentation = "conditional_quddpm.experiments.geometry_aware_augmentation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
