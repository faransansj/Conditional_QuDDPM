dataset: data/tfim_4q_random
subset_seed: 31415
train_states_per_class: 1
train_realizations: 4
diffusion_steps: 2
layers: 3
iterations: 512
ancillas: 2
measurement_outcomes: 8
trained_objective: PER_OUTCOME_ENSEMBLE_MMD
kernels: [global, 2-rdm]
checkpoints: [initial, best]
directions: 32
epsilon: 0.15
near_zero_threshold: 1.0e-6
spsa:
  learning_rate: 0.5
  perturbation: 0.15
# Fixed decision thresholds, declared before the run. "Materially worse"
# near-zero is operationalized as slack 0.05; "catastrophic reversal" at the
# initialization/rho2->rho1 controls as conflict increase > 0.05 or alignment
# drop > 0.10.
decision:
  validity_min_raw: -1.0e-8
  validity_max_clipped_fraction: 0.05
  usable_min_signal_ratio: 0.5
  usable_near_zero_slack: 0.05
  conflict_min_reduction: 0.05
  physics_min_alignment_gain: 0.10
  consistency_conflict_tolerance: 0.05
  consistency_alignment_tolerance: 0.10
seeds:
  train_forward: 121
  init: 140
  spsa: 150
  measurement: 160
  scale_probe: 40160
  permutation: 50160
  directions: 60160
